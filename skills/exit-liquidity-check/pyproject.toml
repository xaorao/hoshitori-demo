[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "exit-liquidity-check"
version = "0.1.0"
description = "Read-only research skill: what does it cost to close a token position, how large an exit fits, and how long does a patient exit take? Modelled figures are labelled; only a venue quote is observed."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
dev = ["pytest==9.2.0", "jsonschema==4.26.0", "ruff==0.17.3", "mypy==2.4.1"]

[project.scripts]
exit-liquidity-check = "exit_liquidity_check.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
exit_liquidity_check = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q -ra -m 'not live'"
markers = ["live: calls the real public sources (DexScreener, Jupiter); never part of the offline suite"]

[tool.ruff]
line-length = 140
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "C4", "SIM", "RUF"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S108", "S311", "E501", "S603", "S310"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/exit_liquidity_check"]
