[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "address-flag-check"
version = "0.1.0"
description = "Read-only research skill: is a blockchain address on OFAC's SDN list or frozen by the USDT or USDC issuer? Never reports absence as safe."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
dev = ["pytest==9.2.0", "jsonschema==4.26.0", "ruff==0.17.3", "mypy==2.4.1"]

[project.scripts]
address-flag-check = "address_flag_check.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
address_flag_check = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q -ra -m 'not live'"
markers = ["live: calls the real public sources (OFAC, PublicNode, TronGrid, mempool.space); never part of the offline suite"]

[tool.ruff]
line-length = 140
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "C4", "SIM", "RUF"]
ignore = ["S101"]  # assert is the test idiom

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S108", "S311", "E501", "S603", "S310"]  # S310: the tests open only http://127.0.0.1 URLs of their own servers

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/address_flag_check"]
